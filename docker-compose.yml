# Calrenove CRM - Despliegue en NAS Synology (Container Manager -> Proyecto)
#
# Uso:
#   1) Copiar este proyecto en /volume1/docker/calrenove-crm/
#   2) Crear .env junto a este fichero (ver .env.nas.example)
#   3) docker compose up -d --build
#   4) App en http://IP_NAS:8100  (o via proxy inverso: https://crm.nascalrenove.synology.me)
#
services:
  calrenove-crm:
    build:
      context: .
    container_name: calrenove-crm
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8100}:3000"
    environment:
      - DATABASE_URL=postgres://calrenove:${POSTGRES_PASSWORD}@calrenove-db:5432/calrenove
      - SESSION_SECRET=${SESSION_SECRET}
      - NODE_ENV=production
    depends_on:
      calrenove-db:
        condition: service_healthy
    volumes:
      - ./data:/data
    extra_hosts:
      - "crm.nascalrenove.synology.me:192.168.1.195"

  calrenove-db:
    image: postgres:16-alpine
    container_name: calrenove-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: calrenove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: calrenove
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calrenove -d calrenove"]
      interval: 5s
      timeout: 5s
      retries: 10
